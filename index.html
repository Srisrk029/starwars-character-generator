<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <title>StarWars Season</title>
    <style>
        .pacifico-regular {
            font-family: "Pacifico", cursive;
            font-weight: 400;
            font-style: normal;
        }
        .tit{
            color:rgb(44, 221, 248);
            text-shadow: 2px 2px 1px whitesmoke;
            margin-bottom:80px;
        }
        .name{
            text-shadow:2px 2px 1px goldenrod;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1 class="tit">Star Wars Season 1</h1>
        <h1 class="name pacifico-regular"></h1>
        <button style="background-color:blanchedalmond;border-radius: 10px;">Generate Character</button>
        <div class="side">
            <img class="character" src="" alt="">
            <h1 class="name1">Species<p class="species"></p></h1>
            <h1 class="name2">Home World<p class="home"></p></h1>
        </div>
    </div>
    

    <script src=" https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js "></script>
    <script src="js/main.js"></script>
</body>
</html>
